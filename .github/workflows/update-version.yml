name: Check for new Beeper release

on:
  schedule:
    # Daily, at an off-peak minute to avoid GitHub's cron rush.
    - cron: '27 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-version
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.update.outputs.updated }}
      version: ${{ steps.update.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the current release and refresh the manifest
        id: update
        run: python3 scripts/update-version.py

      - name: Commit the bump
        id: commit
        if: steps.update.outputs.updated == 'true'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am 'Update Beeper to ${{ steps.update.outputs.version }}'
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # A push made with the default GITHUB_TOKEN does not raise a `push` event, so
  # the bump above would otherwise sit there unbuilt. Invoke the build directly
  # and point it at the commit that was just pushed.
  publish:
    needs: update
    if: needs.update.outputs.updated == 'true'
    uses: ./.github/workflows/build-publish.yml
    with:
      ref: ${{ needs.update.outputs.sha }}
    permissions:
      contents: read
      pages: write
      id-token: write
    secrets: inherit
