name: Build and publish the Flatpak repo

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:
  # Called by update-version.yml. A push it makes with the default GITHUB_TOKEN
  # cannot trigger the `push` event above, so it has to invoke this directly and
  # hand over the commit it just created.
  workflow_call:
    inputs:
      ref:
        description: Commit to build. Defaults to the triggering commit.
        type: string
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  APP_ID: io.github.mark12870.beeper

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      # bwrap needs to set up its own namespaces to build inside a container.
      options: --privileged
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install the runtime, SDK and Electron base app
        run: |
          flatpak install -y --noninteractive flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.electronjs.Electron2.BaseApp//25.08

      - name: Build
        run: |
          flatpak-builder \
            --repo=repo \
            --arch=${{ matrix.arch }} \
            --force-clean \
            --disable-rofiles-fuse \
            --default-branch=stable \
            build "${APP_ID}.yml"

      # Tarred because upload-artifact does not preserve the symlinks an OSTree
      # repository is built out of.
      - name: Pack the repo
        run: tar -cf "repo-${{ matrix.arch }}.tar" repo

      - uses: actions/upload-artifact@v7
        with:
          name: repo-${{ matrix.arch }}
          path: repo-${{ matrix.arch }}.tar
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # No checkout: this job works only from the build artifacts.
      - name: Install flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak ostree

      - uses: actions/download-artifact@v8
        with:
          pattern: repo-*
          path: artifacts
          merge-multiple: true

      - name: Merge the per-architecture repos
        run: |
          ostree --repo=_site/repo init --mode=archive-z2
          for tar in artifacts/repo-*.tar; do
            dir="unpacked/$(basename "$tar" .tar)"
            mkdir -p "$dir"
            tar -xf "$tar" -C "$dir"
            ostree --repo=_site/repo pull-local "$dir/repo"
          done

      - uses: actions/configure-pages@v6
        id: pages

      - name: Import the signing key
        id: gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          # Signing is optional: without the secret the repo still works, users
          # just have to add the remote with --no-gpg-verify.
          if [ -z "${GPG_PRIVATE_KEY}" ]; then
            echo "::warning::GPG_PRIVATE_KEY is not set - publishing an unsigned repo."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          export GNUPGHOME="${RUNNER_TEMP}/gnupg"
          mkdir -p "${GNUPGHOME}" && chmod 700 "${GNUPGHOME}"
          printf '%s' "${GPG_PRIVATE_KEY}" | gpg --batch --import
          keyid="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')"
          {
            echo "signed=true"
            echo "keyid=${keyid}"
            echo "gnupghome=${GNUPGHOME}"
          } >> "$GITHUB_OUTPUT"

      - name: Update and sign the repo
        run: |
          args=(--generate-static-deltas --prune)
          if [ "${{ steps.gpg.outputs.signed }}" = "true" ]; then
            args+=(--gpg-sign="${{ steps.gpg.outputs.keyid }}"
                   --gpg-homedir="${{ steps.gpg.outputs.gnupghome }}")
          fi
          flatpak build-update-repo "${args[@]}" _site/repo

      - name: Generate the .flatpakrepo
        env:
          BASE: ${{ steps.pages.outputs.base_url }}
        run: |
          {
            echo '[Flatpak Repo]'
            echo 'Title=Beeper (unofficial)'
            echo "Url=${BASE}/repo/"
            echo "Homepage=https://github.com/${GITHUB_REPOSITORY}"
            echo 'Comment=Unofficial Flatpak build of the Beeper desktop app'
            echo 'Description=Unofficial Flatpak packaging of the official Beeper desktop application. Not affiliated with Beeper or Automattic.'
            if [ "${{ steps.gpg.outputs.signed }}" = "true" ]; then
              echo "GPGKey=$(gpg --homedir "${{ steps.gpg.outputs.gnupghome }}" \
                --export "${{ steps.gpg.outputs.keyid }}" | base64 -w0)"
            fi
          } > "_site/${APP_ID}.flatpakrepo"

          # Stop Pages from running the upload through Jekyll.
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          # .nojekyll would otherwise be dropped.
          include-hidden-files: true

      - uses: actions/deploy-pages@v5
        id: deploy
