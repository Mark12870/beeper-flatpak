name: Build and publish the Flatpak repo

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:
  # Called by update-version.yml. A push it makes with the default GITHUB_TOKEN
  # cannot trigger the `push` event above, so it has to invoke this directly and
  # hand over the commit it just created.
  workflow_call:
    inputs:
      ref:
        description: Commit to build. Defaults to the triggering commit.
        type: string
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  APP_ID: io.github.mark12870.beeper

jobs:
  build:
    strategy:
      # Without this a flake on one architecture cancels the other, hiding
      # whether it would have passed.
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      # bwrap needs to set up its own namespaces to build inside a container.
      options: --privileged
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install the runtime, SDK and Electron base app
        run: |
          flatpak install -y --noninteractive flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.electronjs.Electron2.BaseApp//25.08

      - name: Build
        run: |
          flatpak-builder \
            --repo=repo \
            --arch=${{ matrix.arch }} \
            --force-clean \
            --disable-rofiles-fuse \
            --default-branch=stable \
            build "${APP_ID}.yml"

      # Tarred because upload-artifact does not preserve the symlinks an OSTree
      # repository is built out of.
      - name: Pack the repo
        run: tar -cf "repo-${{ matrix.arch }}.tar" repo

      - uses: actions/upload-artifact@v7
        with:
          name: repo-${{ matrix.arch }}
          path: repo-${{ matrix.arch }}.tar
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # No checkout: this job works only from the build artifacts.
      - name: Install flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak ostree

      - uses: actions/download-artifact@v8
        with:
          pattern: repo-*
          path: artifacts
          merge-multiple: true

      - name: Merge the per-architecture repos
        run: |
          # ostree init mkdirs only the repo itself, and this job has no checkout.
          mkdir -p _site
          ostree --repo=_site/repo init --mode=archive-z2
          for tar in artifacts/repo-*.tar; do
            dir="unpacked/$(basename "$tar" .tar)"
            mkdir -p "$dir"
            tar -xf "$tar" -C "$dir"
            ostree --repo=_site/repo pull-local "$dir/repo"
          done

      - uses: actions/configure-pages@v6
        id: pages

      - name: Import the signing key
        id: gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # Hard failure rather than a quiet unsigned publish: clients that added
          # the remote while it was signed break on an unsigned update, and a
          # green build should never silently downgrade that.
          if [ -z "${GPG_PRIVATE_KEY}" ]; then
            echo "::error::GPG_PRIVATE_KEY is missing or empty. Add it under" \
                 "Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi

          GNUPGHOME="${RUNNER_TEMP}/gnupg"
          mkdir -p "${GNUPGHOME}" && chmod 700 "${GNUPGHOME}"
          export GNUPGHOME

          # A runner has no terminal, so the agent must never reach for pinentry
          # -- it would die with "Inappropriate ioctl for device". The long cache
          # TTL keeps any passphrase alive across the delta generation that runs
          # before the repo is signed.
          printf 'pinentry-mode loopback\n' > "${GNUPGHOME}/gpg.conf"
          printf 'allow-loopback-pinentry\ndefault-cache-ttl 7200\nmax-cache-ttl 7200\n' \
            > "${GNUPGHOME}/gpg-agent.conf"
          gpgconf --kill gpg-agent || true

          printf '%s\n' "${GPG_PRIVATE_KEY}" | gpg --batch --import
          keyid="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')"
          if [ -z "${keyid}" ]; then
            echo "::error::the secret imported no usable secret key"
            exit 1
          fi

          pass=()
          if [ -n "${GPG_PASSPHRASE}" ]; then
            printf '%s' "${GPG_PASSPHRASE}" > "${GNUPGHOME}/pp"
            pass=(--passphrase-file "${GNUPGHOME}/pp")
          fi

          # Sign once here: proves the key is usable and primes the agent cache so
          # ostree's GPGME signing does not prompt. Failing now costs seconds;
          # failing during build-update-repo costs the whole delta generation.
          if ! err="$(echo smoke | gpg --batch --yes --pinentry-mode loopback \
                       ${pass[@]+"${pass[@]}"} --local-user "${keyid}" \
                       --sign --output /dev/null 2>&1)"; then
            echo "::error::cannot sign with ${keyid}: ${err//$'\n'/ } ::" \
                 "if the key has a passphrase, add it as the GPG_PASSPHRASE secret"
            exit 1
          fi

          echo "signing with ${keyid}"
          {
            echo "keyid=${keyid}"
            echo "gnupghome=${GNUPGHOME}"
          } >> "$GITHUB_OUTPUT"

      - name: Update and sign the repo
        run: |
          # Annotations are readable without repo admin rights; raw logs are not.
          if ! err="$(flatpak build-update-repo --generate-static-deltas --prune \
                       --gpg-sign="${{ steps.gpg.outputs.keyid }}" \
                       --gpg-homedir="${{ steps.gpg.outputs.gnupghome }}" \
                       _site/repo 2>&1 >/dev/null)"; then
            echo "::error::build-update-repo failed: ${err//$'\n'/ }"
            exit 1
          fi
          test -f _site/repo/summary.sig  # the signature must actually exist

          # build-update-repo signs only the summary, but flatpak-builder exported
          # these commits unsigned in the build jobs, and a client with
          # gpg-verify=true refuses to install a commit carrying no signature.
          # Signatures are detached, so adding them here leaves the summary valid.
          for ref in $(ostree --repo=_site/repo refs); do
            ostree --repo=_site/repo gpg-sign \
              --gpg-homedir="${{ steps.gpg.outputs.gnupghome }}" \
              "$(ostree --repo=_site/repo rev-parse "${ref}")" \
              "${{ steps.gpg.outputs.keyid }}"
          done

      - name: Generate the .flatpakrepo
        env:
          BASE: ${{ steps.pages.outputs.base_url }}
        run: |
          {
            echo '[Flatpak Repo]'
            echo 'Title=Beeper (unofficial)'
            echo "Url=${BASE}/repo/"
            echo "Homepage=https://github.com/${GITHUB_REPOSITORY}"
            echo 'Comment=Unofficial Flatpak build of the Beeper desktop app'
            echo 'Description=Unofficial Flatpak packaging of the official Beeper desktop application. Not affiliated with Beeper or Automattic.'
            echo "GPGKey=$(gpg --homedir "${{ steps.gpg.outputs.gnupghome }}" \
              --export "${{ steps.gpg.outputs.keyid }}" | base64 -w0)"
          } > "_site/${APP_ID}.flatpakrepo"

          # Stop Pages from running the upload through Jekyll.
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          # .nojekyll would otherwise be dropped.
          include-hidden-files: true

      - uses: actions/deploy-pages@v5
        id: deploy
